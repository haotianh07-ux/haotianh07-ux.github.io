<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISKIS STUDIO | Debut Capsule</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

    <style>
        /* LUXURY MINIMALIST STYLING */
        :root {
            --ivory: #FDFBF7;
            --light-gray: #E5E5E5;
            --charcoal: #2C2C2C;
            --sage: #8A9A86;
            --lavender: #BDB2C6;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ivory);
            color: var(--charcoal);
            text-align: center;
        }

        /* COMPACT FULL SCREEN HERO HEADER */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Applying Aboreto font directly to your branding elements */
        .brand-name {
            font-family: 'Aboreto', system-ui;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 15px;
            padding-left: 0.6em; /* Keeps text perfectly centered with letter-spacing */
        }

        .sub-title {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #777;
            padding-left: 0.4em;
        }

        /* SCROLL INDICATOR */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #aaa;
            animation: bounce 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* MAIN CONTENT AREA */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px 20px;
        }

        .collection-heading {
            font-family: 'Aboreto', system-ui;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        /* PRODUCT GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        /* REPEATABLE SCROLL ANIMATION & HOVER EFFECTS */
        .product-card {
            background-color: #fff;
            border: 1px solid var(--light-gray);
            padding: 15px;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.4s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
            
            /* Hidden state when scrolled away */
            opacity: 0;
            transform: translateY(30px);
        }

        /* Active scroll state */
        .product-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Premium mouse hover interaction */
        .product-card.reveal:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .image-container {
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .img-loose-shirt { background-color: var(--lavender); color: var(--ivory); }
        .img-pump-cover { background-color: var(--light-gray); color: var(--charcoal); }
        .img-pants { background-color: #4a4a4a; color: var(--ivory); }
        .img-accessory { background-color: var(--ivory); border: 1px solid var(--light-gray); color: var(--charcoal); }

        .product-title {
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 10px 0 5px 0;
        }

        .product-price {
            font-size: 0.85rem;
            color: #666;
        }

        /* PREMIUM EXPANDED FOOTER */
        footer {
            background-color: #fff;
            border-top: 1px solid var(--light-gray);
            margin-top: 140px;
            padding: 80px 20px 40px 20px;
        }

        .footer-content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CENTERED SLOGAN TILE ROW */
        .footer-slogan-row {
            text-align: center;
            padding-bottom: 50px;
            margin-bottom: 50px;
            border-bottom: 1px solid #f0f0f0;
        }

        .footer-slogan-row .slogan {
            font-size: 1.1rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.05em;
            color: var(--charcoal);
            line-height: 1.6;
            margin: 0 auto;
            max-width: 600px;
        }

        /* LOWER CONTACT & UTILITY GRID */
        .footer-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            text-align: left;
        }

        .footer-logo {
            font-family: 'Aboreto', system-ui;
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .footer-heading {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--charcoal);
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            font-size: 0.85rem;
            color: #666;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #000;
        }

        .newsletter-form {
            display: flex;
            margin-top: 15px;
            border-bottom: 1px solid var(--charcoal);
            padding-bottom: 5px;
            max-width: 300px;
        }

        .newsletter-input {
            border: none;
            background: none;
            font-size: 0.85rem;
            padding: 5px 0;
            width: 100%;
            color: var(--charcoal);
            outline: none;
        }

        .newsletter-input::placeholder {
            color: #aaa;
            letter-spacing: 0.1em;
        }

        .newsletter-btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
